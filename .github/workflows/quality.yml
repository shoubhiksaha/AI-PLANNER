name: Quality Gate

# Reusable test suite. Called by pr-check.yml, staging.yml and production.yml so every
# path to an environment runs the same checks.
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  conflict_check:
    name: Conflict Marker Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Guard unresolved merge conflicts
        run: bash ./scripts/check-conflict-markers.sh

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci
      - name: ESLint (functions)
        working-directory: ./functions
        run: npm run lint

  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (functions runtime deps, high+)
        working-directory: ./functions
        run: npm audit --omit=dev --audit-level=high

  frontend_tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:frontend
      - name: Environment config generator (staging vs production)
        run: node --test scripts/ci/firebase-config.test.js && node scripts/ci/firebase-config.js --check
      - name: Compiled Tailwind CSS is up to date
        run: |
          npm run build:css
          if ! git diff --quiet -- public/tailwind.css; then
            echo "::error title=Stale CSS::public/tailwind.css is out of date. Run 'npm run build:css' and commit the result."
            exit 1
          fi

  backend_tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci
      - name: Unit & integration tests
        working-directory: ./functions
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test

  firestore_rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1
      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci
      - name: Rules tests on the emulator
        working-directory: ./functions
        run: |
          firebase emulators:exec \
            --project demo-ai-planner \
            --only firestore \
            "npx jest __tests__/firestore.rules.test.js --verbose --coverage=false --testPathIgnorePatterns=/node_modules/ --forceExit"

  mobile_lint:
    name: Mobile Lint & Tests
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci
      - name: ESLint (mobile)
        working-directory: ./mobile
        run: npm run lint
      - name: Unit tests (mobile bridge)
        working-directory: ./mobile
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend_tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium
      - name: Serve public/ and run smoke + UI specs
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: |
          python3 -m http.server 3000 --directory public >/tmp/ai-planner-e2e-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          cd e2e
          npx playwright test tests/sync.spec.js tests/ui.spec.js --project=chromium
      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

  emulator_e2e:
    name: Emulator E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: [backend_tests, frontend_tests]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1
      - name: Install dependencies
        run: |
          (cd functions && npm ci)
          (cd e2e && npm ci)
      - name: Install browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Full-stack tests on the Firebase emulators
        env:
          CI: true
        run: bash scripts/e2e/run-emulator-e2e.sh
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-e2e-report-${{ github.run_id }}
          path: e2e/playwright-report-emulator/
          retention-days: 14
