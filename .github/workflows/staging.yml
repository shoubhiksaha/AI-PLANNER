name: Staging Deploy

# A feature branch merged into `staging` (via PR, merge commit) is tested again and then
# deployed to the staging environment: Firestore database "staging", functions in asia-south1 and
# Hosting site ai-planner-staging, all inside project ai-planner-project-467800.
# The deploy job waits for the owner's approval on the `staging` GitHub environment.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to Staging
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://ai-planner-staging.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.1
      - name: Authenticate to Google Cloud (Workload Identity)
        if: ${{ vars.WIF_PROVIDER != '' && vars.SA_EMAIL != '' }}
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}
      - name: Deploy
        env:
          FIREBASE_TOKEN: ${{ (vars.WIF_PROVIDER == '' || vars.SA_EMAIL == '') && secrets.FIREBASE_TOKEN || '' }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
        run: bash scripts/ci/deploy.sh staging

  verify:
    name: Post-Deploy Verification (Staging)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium
      - name: Contract tests against staging
        working-directory: ./e2e
        env:
          TARGET_URL: https://ai-planner-staging.web.app
          EXPECTED_PROJECT_ID: ai-planner-project-467800
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_DATABASE: staging
          EXPECTED_REGION: asia-south1
          CI: true
        run: npx playwright test tests/staging-contract.spec.js --project=chromium
