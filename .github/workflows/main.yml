name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run all backend tests with coverage
  # ─────────────────────────────────────────────
  test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Run Unit & Integration Tests
      working-directory: ./functions
      run: npm test

  # ─────────────────────────────────────────────
  # JOB 2: Firestore Security Rules (Emulator)
  # ─────────────────────────────────────────────
  firestore_rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Setup Java (required by Firebase Emulator)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Run Firestore Rules Tests via Emulator
      working-directory: ./functions
      run: |
        firebase emulators:exec \
          --project ai-planner-project-467800 \
          --only firestore \
          "npx jest __tests__/firestore.rules.test.js --verbose"

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Firebase (only on main push)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [test, firestore_rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Deploy Hosting + Functions
      run: firebase deploy --project ai-planner-project-467800
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
