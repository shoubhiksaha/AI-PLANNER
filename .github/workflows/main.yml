name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run all frontend tests
  # ─────────────────────────────────────────────
  frontend_tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Guard unresolved merge conflicts
      run: bash ./scripts/check-conflict-markers.sh

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Frontend Tests
      run: npm run test:frontend

  # ─────────────────────────────────────────────
  # JOB 2: Run all backend tests with coverage
  # ─────────────────────────────────────────────
  backend_tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Guard unresolved merge conflicts
      run: bash ./scripts/check-conflict-markers.sh

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Run Unit & Integration Tests
      working-directory: ./functions
      run: npm test

  # ─────────────────────────────────────────────
  # JOB 2: Firestore Security Rules (Emulator)
  # ─────────────────────────────────────────────
  firestore_rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Guard unresolved merge conflicts
      run: bash ./scripts/check-conflict-markers.sh

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Setup Java (required by Firebase Emulator)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools@13

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Run Firestore Rules Tests via Emulator
      working-directory: ./functions
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase emulators:exec \
          --project ai-planner-project-467800 \
          --only firestore \
          "npx jest __tests__/firestore.rules.test.js --verbose"

  # ─────────────────────────────────────────────
  # JOB 3: Playwright smoke test (headless)
  # ─────────────────────────────────────────────
  e2e_smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend_tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Guard unresolved merge conflicts
      run: bash ./scripts/check-conflict-markers.sh

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install E2E dependencies
      working-directory: ./e2e
      run: npm ci

    - name: Install Playwright Browser
      working-directory: ./e2e
      run: npx playwright install --with-deps chromium

    - name: Run Smoke Test
      env:
        BASE_URL: http://localhost:3000
        CI: true
      run: |
        cd public
        python3 -m http.server 3000 >/tmp/ai-planner-e2e-http.log 2>&1 &
        SERVER_PID=$!
        sleep 3
        cd ../e2e
        npx playwright test tests/sync.spec.js --project=chromium
        EXIT_CODE=$?
        kill $SERVER_PID >/dev/null 2>&1 || true
        exit $EXIT_CODE

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to Firebase (only on main push)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [backend_tests, frontend_tests, firestore_rules, e2e_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Guard unresolved merge conflicts
      run: bash ./scripts/check-conflict-markers.sh

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Functions Dependencies
      working-directory: ./functions
      run: npm ci

    - name: Install Firebase CLI
      run: npm install -g firebase-tools@13

    - name: Create Functions .env from secrets
      working-directory: ./functions
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "KMS_KEY_NAME=projects/ai-planner-project-467800/locations/global/keyRings/byok-ring/cryptoKeys/byok-key" >> .env

    - name: Deploy Hosting + Functions
      run: firebase deploy --project ai-planner-project-467800
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
