name: PR Quality Gate

on:
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Guard unresolved merge conflicts
  # ─────────────────────────────────────────────
  conflict_check:
    name: Conflict Marker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Guard unresolved merge conflicts
        run: bash ./scripts/check-conflict-markers.sh

  # ─────────────────────────────────────────────
  # JOB 2: ESLint Check
  # ─────────────────────────────────────────────
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci
      - name: Run ESLint
        working-directory: ./functions
        run: npm run lint

  # ─────────────────────────────────────────────
  # JOB 3: Frontend Tests
  # ─────────────────────────────────────────────
  frontend_tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Root Dependencies
        run: npm ci
      - name: Run Frontend Tests
        run: npm run test:frontend

  # ─────────────────────────────────────────────
  # JOB 4: Backend Tests with Coverage
  # ─────────────────────────────────────────────
  backend_tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci
      - name: Run Unit & Integration Tests
        working-directory: ./functions
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 5: Firestore Rules Tests (Emulator)
  # ─────────────────────────────────────────────
  firestore_rules:
    name: Firestore Security Rules (Emulator)
    runs-on: ubuntu-latest
    needs: [conflict_check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Setup Java 21 (Firebase Emulator prerequisite)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci
      - name: Run Firestore Rules Tests via Emulator
        working-directory: ./functions
        run: |
          firebase emulators:exec \
            --project ai-planner-staging \
            --only firestore \
            "npx jest __tests__/firestore.rules.test.js --verbose"

  # ─────────────────────────────────────────────
  # JOB 6: Playwright Smoke Test
  # ─────────────────────────────────────────────
  e2e_smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E Dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium
      - name: Run Smoke Test
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: |
          cd public
          python3 -m http.server 3000 >/tmp/ai-planner-e2e-http.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          cd ../e2e
          npx playwright test tests/sync.spec.js --project=chromium
          EXIT_CODE=$?
          kill $SERVER_PID >/dev/null 2>&1 || true
          exit $EXIT_CODE
      - name: Upload Playwright Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-pr-report
          path: e2e/playwright-report/
          retention-days: 30
