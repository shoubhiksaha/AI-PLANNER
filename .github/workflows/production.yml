name: Production Deploy

# A feature branch merged into `main` (via its own PR — never from `staging`) is checked for
# staging provenance, tested again, and deployed to the production environment (Firestore database
# "(default)", functions in us-central1, Hosting site ai-planner-project-467800) after the owner
# approves the run on the `production` GitHub environment.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  provenance:
    name: Staging Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit on main must have shipped to staging first
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash scripts/ci/branch-policy.sh push "$BEFORE" "$AFTER"

  quality:
    name: Quality
    needs: [provenance]
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to Production
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://planner.analogdigital.tech
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.1
      - name: Authenticate to Google Cloud (Workload Identity)
        if: ${{ vars.WIF_PROVIDER != '' && vars.SA_EMAIL != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}
      - name: Deploy
        env:
          FIREBASE_TOKEN: ${{ (vars.WIF_PROVIDER == '' || vars.SA_EMAIL == '') && secrets.FIREBASE_TOKEN || '' }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
        run: bash scripts/ci/deploy.sh production

  verify:
    name: Post-Deploy Verification (Production)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium
      - name: Contract tests against production
        working-directory: ./e2e
        env:
          TARGET_URL: https://planner.analogdigital.tech
          EXPECTED_PROJECT_ID: ai-planner-project-467800
          EXPECTED_ENVIRONMENT: production
          EXPECTED_DATABASE: (default)
          EXPECTED_REGION: us-central1
          CI: true
        run: npx playwright test tests/staging-contract.spec.js --project=chromium
      - name: How to roll back
        if: failure()
        run: |
          echo "::error title=Production verification failed::Roll back Hosting in Firebase Console → Hosting → Release history, then revert the offending PR on a new branch and ship it through staging → main."
