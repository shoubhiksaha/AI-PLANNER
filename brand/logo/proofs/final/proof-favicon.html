<!doctype html><html><head><meta charset='utf-8'><style>
body{font:13px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#111}
h2{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:18px;padding:10px;border-bottom:1px dashed #e5e5e5;flex-wrap:nowrap;overflow:hidden}
.row.dark{background:#111;color:#eee}
.lbl{font:600 11px monospace;text-transform:uppercase;opacity:.6;flex:0 0 78px}
img{max-width:1000px;object-fit:contain}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
figcaption{font:11px monospace;opacity:.6}
.avatar{flex:0 0 96px;height:96px;border-radius:50%;overflow:hidden;background:#f2f2f2;display:flex;align-items:center;justify-content:center}
.avatar img{max-width:78%;max-height:78%}
.appicon{flex:0 0 96px;height:96px;border-radius:22px;background:#f2f2f2;display:flex;align-items:center;justify-content:center}
.appicon img{max-width:70%;max-height:70%}
.card{flex:0 0 300px;height:96px;border-radius:10px;background:#1e1e24;display:flex;align-items:center;justify-content:center}
.card img{max-width:85%;max-height:60%}

.mock{border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.web{width:640px;background:#fff;border:1px solid #ddd}
.web .nav{display:flex;align-items:center;gap:32px;padding:14px 20px;border-bottom:1px solid #eee}
.web .nav img{max-height:32px;max-width:220px;width:auto;height:auto}
.web .menu{font-size:12px;color:#444;white-space:pre}
.web .hero{padding:40px 20px 36px}
.web .h{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.web .p{font-size:13px;color:#555;max-width:380px;margin-bottom:16px}
.web .btn{display:inline-block;background:#111;color:#fff;font-size:12px;padding:8px 14px;border-radius:6px}
.card{width:340px;height:196px;background:#fafafa;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #e5e5e5}
.card img{max-height:40px;max-width:200px;width:auto;height:auto;align-self:flex-start}
.cardtxt{font-size:12px;line-height:1.5}.dim{color:#666}
.sign{width:340px;height:196px;background:linear-gradient(#8a8f96,#5f646b);display:flex;align-items:center;justify-content:center}
.signface{width:280px;height:120px;background:#f4f1ea;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #2b2b2b}
.signface img{max-width:80%;max-height:64%}
.phone{width:200px;height:400px;background:#111;border-radius:28px;padding:10px}
.screen{width:100%;height:100%;border-radius:20px;background:linear-gradient(160deg,#3b5bdb,#9c36b5);padding:28px 14px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.app{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.35)}
.app.real{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.app.real img{width:70%;height:70%;object-fit:contain}
.label{width:200px;height:90px;background:#e9e2d3;display:flex;align-items:center;justify-content:center;border:1px dashed #b9b1a0}
.label img{max-width:70%;max-height:60%;image-rendering:pixelated;filter:contrast(100) grayscale(1)}
body{width:1150px}</style></head><body>
